name: Build low-memory TFLite model

on:
  push:
    branches: [main]
    paths:
      - 'models/plantvillage_best.keras'
      - 'models/labels.json'
      - 'scripts/convert_model_to_tflite.py'
      - '.github/workflows/build-tflite-model.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install conversion dependencies
        run: python -m pip install --upgrade pip && python -m pip install tensorflow==2.18.0

      - name: Convert trained Keras checkpoint to TFLite
        run: python scripts/convert_model_to_tflite.py

      - name: Commit generated TFLite model
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/plantvillage_best.tflite models/tflite_metadata.json
          git diff --cached --quiet && exit 0
          git commit -m 'build genuine PlantVillage model in low-memory TFLite format'
          git push
