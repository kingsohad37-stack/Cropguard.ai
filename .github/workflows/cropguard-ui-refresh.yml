name: CropGuard UI Refresh
on:
  push:
    paths:
      - '.github/workflows/cropguard-ui-refresh.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply complete visual redesign
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/app.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('st.markdown(\n    """')
          end_marker = '""",\n    unsafe_allow_html=True,\n)'
          end = s.index(end_marker, start) + len(end_marker)
          css = '''st.markdown(\n    """\n<style>\n/* CropGuard — complete premium glass redesign. Visual CSS only. */\n:root{--cg-ink:#102a19;--cg-muted:#4f6657;--cg-glass:rgba(255,255,255,.76);--cg-border:rgba(255,255,255,.9);--cg-shadow:0 24px 70px rgba(13,58,29,.16)}\nhtml,body,.stApp{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif!important;color:var(--cg-ink)!important}\n.stApp{min-height:100vh!important;background:#dcebdc url('/app/static/cropguard-bg.jpg') center/cover fixed no-repeat!important}\n[data-testid="stAppViewContainer"],[data-testid="stAppViewContainer"]>.main,.main,.main .block-container{background:transparent!important}\n[data-testid="stAppViewContainer"]:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 15% 5%,rgba(255,255,255,.8),transparent 30%),radial-gradient(circle at 90% 85%,rgba(77,160,98,.2),transparent 35%)}\n[data-testid="stHeader"]{background:transparent!important}\n.main .block-container{position:relative;z-index:1;width:min(calc(100% - 32px),1080px)!important;max-width:1080px!important;margin:0 auto!important;padding:38px 0 70px!important}\nh1,h2,h3,h4{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif!important;color:var(--cg-ink)!important;font-weight:850!important;letter-spacing:-.045em!important;line-height:1.04!important}\nh1{font-size:clamp(2.8rem,7vw,4.8rem)!important;margin:.15rem 0 .5rem!important}h2{font-size:clamp(2rem,5vw,3rem)!important}h3{font-size:clamp(1.35rem,3vw,1.9rem)!important}\np,li,[data-testid="stCaptionContainer"],label{color:var(--cg-muted)!important;font-size:1.06rem!important;font-weight:600!important;line-height:1.58!important}\n/* Large outer glass cards make every text section stable and readable. */\n[data-testid="stVerticalBlockBorderWrapper"]{width:100%!important;box-sizing:border-box!important;background:var(--cg-glass)!important;border:1px solid var(--cg-border)!important;border-radius:28px!important;box-shadow:var(--cg-shadow)!important;backdrop-filter:blur(24px) saturate(125%)!important;-webkit-backdrop-filter:blur(24px) saturate(125%)!important;overflow:hidden!important}\n[data-testid="stVerticalBlockBorderWrapper"]>div{min-width:0!important}\n[data-testid="stFileUploaderDropzone"],[data-testid="stCameraInput"]{background:rgba(255,255,255,.72)!important;border:2px dashed rgba(24,105,56,.22)!important;border-radius:22px!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.9)!important}\n[data-testid="stFileUploaderDropzone"] *{color:var(--cg-ink)!important}\n.stTextInput input,[data-baseweb="select"]>div{background:rgba(255,255,255,.9)!important;color:var(--cg-ink)!important;border:1px solid rgba(22,78,42,.14)!important;border-radius:16px!important;min-height:48px!important}\n[data-baseweb="select"] *{color:var(--cg-ink)!important}\n.stButton>button,.stDownloadButton>button{width:auto!important;min-height:50px!important;padding:0 25px!important;border-radius:999px!important;border:1px solid rgba(255,255,255,.95)!important;background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(232,245,235,.86))!important;color:#163a24!important;font-weight:800!important;box-shadow:0 12px 32px rgba(18,75,40,.14),inset 0 1px 0 #fff!important;transition:transform .2s ease,box-shadow .2s ease!important}\n.stButton>button:hover,.stDownloadButton>button:hover{transform:translateY(-2px) scale(1.03)!important;box-shadow:0 18px 42px rgba(18,75,40,.2),inset 0 1px 0 #fff!important}.stButton>button:active,.stDownloadButton>button:active{transform:scale(.97)!important}\n.stButton>button[kind="primary"]{background:linear-gradient(135deg,#2b8d52,#126337)!important;color:#fff!important;box-shadow:0 14px 38px rgba(20,105,55,.3),inset 0 1px 0 rgba(255,255,255,.35)!important}\n[data-testid="stMetric"]{background:rgba(255,255,255,.86)!important;border:1px solid rgba(255,255,255,.95)!important;border-radius:22px!important;padding:17px!important;box-shadow:0 12px 35px rgba(18,70,37,.11)!important}[data-testid="stMetricValue"],[data-testid="stMetricLabel"]{color:var(--cg-ink)!important}\n[data-testid="stImage"] img{display:block!important;width:100%!important;height:auto!important;max-width:100%!important;object-fit:contain!important;border-radius:22px!important;border:1px solid rgba(255,255,255,.9)!important;box-shadow:0 18px 48px rgba(18,70,37,.14)!important}\n[data-testid="stDataFrame"],[data-testid="stTable"]{width:100%!important;max-width:100%!important;border-radius:20px!important;overflow:hidden!important}\n/* Remove any accidental code/debug presentation below Scan History. */\npre,[data-testid="stCodeBlock"],.stCodeBlock,[data-testid="stException"]{display:none!important}\nfooter{visibility:hidden!important}\n[data-testid="stAlert"]{border-radius:18px!important}\nhr{border:0!important;border-top:1px solid rgba(28,83,46,.14)!important}\n@media(max-width:700px){\n .stApp{background-attachment:scroll!important;background-position:center top!important}\n .main .block-container{width:calc(100% - 18px)!important;padding:16px 0 45px!important}\n h1{font-size:2.65rem!important}h2{font-size:1.9rem!important}h3{font-size:1.28rem!important}\n .main .block-container p,.main .block-container li{font-size:1.01rem!important;line-height:1.52!important}\n [data-testid="stVerticalBlockBorderWrapper"]{border-radius:22px!important;padding:18px!important}\n .stButton>button,.stDownloadButton>button{width:100%!important}\n}\n</style>\n""",unsafe_allow_html=True)'''
          p.write_text(s[:start] + css + s[end:], encoding='utf-8')
          PY
          python -m py_compile frontend/app.py
      - name: Commit and push without race conditions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/app.py
          git rm -f .github/workflows/cropguard-ui-refresh.yml
          git commit -m 'Apply complete stable CropGuard UI redesign'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 3
          done
          echo 'Unable to push the UI redesign after 5 attempts.'
          exit 1
