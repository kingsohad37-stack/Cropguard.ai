name: CropGuard UI Refresh
on:
  push:
    paths:
      - '.github/workflows/cropguard-ui-refresh.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace visual layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/app.py')
          s=p.read_text()
          start=s.index('st.markdown(\n    """')
          end=s.index('""",\n    unsafe_allow_html=True,\n)', start)+len('""",\n    unsafe_allow_html=True,\n)')
          css='''st.markdown("""\n<style>\n:root{--ink:#10281a;--muted:#53675a}\nhtml,body,.stApp{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif!important;color:var(--ink)!important}\n.stApp{background:#dcebdc url('/app/static/cropguard-bg.jpg') center/cover fixed!important}\n[data-testid="stAppViewContainer"],[data-testid="stAppViewContainer"]>.main,.main,.main .block-container{background:transparent!important}\n.main .block-container{width:min(calc(100% - 32px),1100px)!important;max-width:1100px!important;margin:auto!important;padding:30px 0 70px!important}\n[data-testid="stHeader"]{background:transparent!important}\nh1,h2,h3,h4{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif!important;color:var(--ink)!important;font-weight:800!important;letter-spacing:-.045em!important;line-height:1.05!important}\nh1{font-size:clamp(2.7rem,7vw,4.7rem)!important}h2{font-size:clamp(2rem,5vw,3rem)!important}h3{font-size:clamp(1.35rem,3vw,1.9rem)!important}\np,li,[data-testid="stCaptionContainer"],label{color:var(--muted)!important;font-weight:550!important;line-height:1.6!important}\n[data-testid="stVerticalBlockBorderWrapper"]{background:rgba(255,255,255,.78)!important;border:1px solid rgba(255,255,255,.94)!important;border-radius:28px!important;box-shadow:0 18px 55px rgba(20,65,35,.14)!important;backdrop-filter:blur(22px)!important}\n[data-testid="stFileUploaderDropzone"],[data-testid="stCameraInput"]{background:rgba(255,255,255,.72)!important;border:2px dashed rgba(28,100,55,.24)!important;border-radius:22px!important}\n[data-testid="stFileUploaderDropzone"] *{color:var(--ink)!important}\n.stButton>button,.stDownloadButton>button{border-radius:999px!important;min-height:50px!important;padding:0 24px!important;background:rgba(255,255,255,.92)!important;color:var(--ink)!important;border:1px solid rgba(255,255,255,.98)!important;font-weight:750!important;box-shadow:0 10px 28px rgba(20,70,38,.13)!important;transition:all .2s ease!important}\n.stButton>button:hover,.stDownloadButton>button:hover{transform:translateY(-2px) scale(1.02)!important}.stButton>button[kind="primary"]{background:linear-gradient(135deg,#247d48,#125c33)!important;color:white!important}\n[data-testid="stMetric"]{background:rgba(255,255,255,.84)!important;border:1px solid rgba(255,255,255,.96)!important;border-radius:20px!important;padding:16px!important}[data-testid="stMetricValue"],[data-testid="stMetricLabel"]{color:var(--ink)!important}\n[data-testid="stImage"] img{border-radius:22px!important;box-shadow:0 16px 45px rgba(20,65,35,.14)!important}[data-testid="stDataFrame"]{border-radius:20px!important;overflow:hidden!important}\npre,[data-testid="stCodeBlock"],.stCodeBlock{display:none!important}footer{visibility:hidden!important}\n@media(max-width:700px){.main .block-container{width:calc(100% - 18px)!important;padding:14px 0 45px!important}h1{font-size:2.65rem!important}h2{font-size:1.9rem!important}.main .block-container [data-testid="stVerticalBlockBorderWrapper"]{border-radius:22px!important;padding:18px!important}.stButton>button,.stDownloadButton>button{width:100%!important}}\n</style>\n""",unsafe_allow_html=True)'''
          p.write_text(s[:start]+css+s[end:])
          PY
      - name: Validate and commit
        run: |
          python -m py_compile frontend/app.py
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add frontend/app.py
          git commit -m "Refresh CropGuard UI with stable premium responsive design"
          git rm .github/workflows/cropguard-ui-refresh.yml
          git commit -m "Remove one-time UI refresh workflow"
          git push
