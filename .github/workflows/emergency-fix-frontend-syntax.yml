name: Emergency repair frontend syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair advisory card indentation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/app.py')
          s = p.read_text(encoding='utf-8')
          start = s.find('                    advisory = data.get("advisory") or {}')
          if start < 0:
              raise SystemExit('broken advisory block not found')
          end = s.find('\n\n st.divider()', start)
          if end < 0:
              end = s.find('\n\nst.divider()', start)
          if end < 0:
              raise SystemExit('result section boundary not found')
          block = '''                    advisory = data.get("advisory") or {}
                    with st.container(border=True):
                        st.markdown("### 🩺 Disease fix & treatment")
                        summary = advisory.get("summary") or "Follow the recommended disease-management steps below."
                        st.markdown(f"**What to do:** {summary}")
                        actions = advisory.get("actions") or []
                        if actions:
                            for action in actions:
                                st.markdown(f"- {action}")
                        else:
                            st.info("No class-specific treatment steps are available for this result.")
                        for source_link in advisory.get("sources", []):
                            st.caption(source_link)
                except requests.RequestException as exc: st.error(f"Backend/inference error: {exc}")'''
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate Python syntax
        run: python -m py_compile frontend/app.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app.py
          git commit -m "Repair CropGuard frontend syntax" || exit 0
          git push