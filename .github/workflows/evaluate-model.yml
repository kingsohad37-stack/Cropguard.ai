name: Preserve trained CropGuard model

on:
  push:
    paths:
      - '.github/workflows/evaluate-model.yml'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Completed training workflow run containing the model artifact'
        required: true
        default: '34695021182'
        type: string

permissions:
  contents: write
  actions: read

jobs:
  preserve-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download completed training artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || '34695021182' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cropguard models
          curl -L --fail --retry 5 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            -o /tmp/cropguard/artifacts.json
          ARTIFACT_ID=$(python - <<'PY'
          import json
          data=json.load(open('/tmp/cropguard/artifacts.json'))
          matches=[a for a in data.get('artifacts',[]) if a.get('name')=='cropguard-training-results' and not a.get('expired')]
          if not matches:
              raise SystemExit('No unexpired cropguard-training-results artifact found for the requested run')
          print(matches[0]['id'])
          PY
          )
          curl -L --fail --retry 5 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/cropguard/results.zip
          unzip -j -q /tmp/cropguard/results.zip -d models
          test -s models/plantvillage_best.keras
          echo "Preserving trained model from run ${RUN_ID}, artifact ${ARTIFACT_ID}."

      - name: Publish model as permanent release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view cropguard-model-v1 >/dev/null 2>&1; then
            gh release upload cropguard-model-v1 models/plantvillage_best.keras --clobber
            gh release upload cropguard-model-v1 models/training_log.csv --clobber || true
          else
            gh release create cropguard-model-v1 \
              models/plantvillage_best.keras \
              models/training_log.csv \
              --target main \
              --title 'CropGuard trained model v1' \
              --notes 'Permanent trained model from workflow run 34695021182. Evaluation intentionally skipped; no retraining performed.'
          fi
