name: Final syntax repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix exception indentation and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/app.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('\n                except requests.RequestException as exc:', '\n            except requests.RequestException as exc:')
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile frontend/app.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app.py
          git commit -m "Fix frontend exception indentation" || exit 0
          git push