name: Fix advisory matching
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix advisory lookup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/main.py')
          s = p.read_text(encoding='utf-8')
          old = '''    wanted = normalize(label)\n    # PlantVillage labels use Crop___Disease, while the advisory database stores\n    # the disease key without the crop prefix. Match both forms so the real\n    # class-specific treatment card is restored without changing inference.\n    disease_part = label.split("___", 1)[-1] if "___" in label else label\n    disease_wanted = normalize(disease_part)\n    for key, advisory in TREATMENTS.items():\n        normalized_key = normalize(key)\n        if normalized_key == wanted or normalized_key == disease_wanted:\n            return advisory\n'''
          new = '''    wanted = normalize(label)\n    # PlantVillage uses Crop___Disease while treatments.json uses Crop_Disease.\n    # Normalize both the full label and disease-only form so class-specific\n    # treatment advice is returned without touching inference/model behavior.\n    crop_disease_wanted = normalize(label.replace("___", "_"))\n    disease_part = label.split("___", 1)[-1] if "___" in label else label\n    disease_wanted = normalize(disease_part)\n    for key, advisory in TREATMENTS.items():\n        normalized_key = normalize(key)\n        if normalized_key in {wanted, crop_disease_wanted, disease_wanted}:\n            return advisory\n'''
          if old not in s:
              raise SystemExit('expected advisory lookup block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          python -m py_compile backend/main.py
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/main.py
          git commit -m "Fix class-specific disease advisory matching"
          git push
          git rm .github/workflows/fix-advisory-match.yml
          git commit -m "Remove temporary advisory repair workflow"
          git push
