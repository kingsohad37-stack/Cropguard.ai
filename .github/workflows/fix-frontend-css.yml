name: CropGuard frontend final repair
on:
  push:
    branches: [main]
    paths:
      - 'frontend/app.py'
      - '.github/workflows/fix-frontend-css.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply final mobile UI repair
        shell: python
        run: |
          from pathlib import Path
          import re
          path=Path('frontend/app.py')
          text=path.read_text(encoding='utf-8')
          css='''<style>
          :root{--ink:#123524;--muted:#496457;--glass:rgba(247,252,248,.78);--line:rgba(255,255,255,.82)}
          html,body,.stApp{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif!important;color:var(--ink)!important}
          body{background:#dfeee2!important}
          [data-testid="stAppViewContainer"]{min-height:100vh!important;background:linear-gradient(180deg,rgba(235,246,237,.18),rgba(210,233,216,.38)),url('/app/static/cropguard-bg.jpg') center/cover fixed no-repeat!important}
          [data-testid="stAppViewContainer"]>.main,[data-testid="stAppViewContainer"] .main,[data-testid="stAppViewContainer"] .block-container{background:transparent!important}
          [data-testid="stHeader"]{background:transparent!important}
          .main .block-container{position:relative!important;z-index:2!important;width:min(100%,980px)!important;max-width:980px!important;margin:0 auto!important;padding:2rem 1rem 4rem!important;overflow-x:hidden!important;text-align:left!important}
          h1,h2,h3,h4{color:var(--ink)!important;font-weight:800!important;letter-spacing:-.035em!important;line-height:1.1!important;text-align:left!important}
          h1{font-size:clamp(2.2rem,7vw,4rem)!important;margin:.2rem 0 .45rem!important}
          h2{font-size:clamp(1.5rem,4vw,2rem)!important} h3{font-size:clamp(1.15rem,3vw,1.4rem)!important}
          p,[data-testid="stCaptionContainer"],label{color:var(--muted)!important;text-align:left!important;line-height:1.5!important}
          [data-testid="stVerticalBlockBorderWrapper"]{background:var(--glass)!important;backdrop-filter:blur(18px) saturate(120%)!important;-webkit-backdrop-filter:blur(18px) saturate(120%)!important;border:1px solid var(--line)!important;border-radius:24px!important;box-shadow:0 18px 55px rgba(12,55,31,.15)!important}
          [data-testid="stFileUploaderDropzone"]{background:rgba(255,255,255,.86)!important;border:1px solid rgba(255,255,255,.95)!important;border-radius:22px!important;box-shadow:0 12px 34px rgba(12,55,31,.11)!important}
          [data-testid="stFileUploaderDropzone"] *{color:var(--ink)!important}
          [data-testid="stCameraInput"]{width:100%!important;max-width:100%!important;overflow:hidden!important;background:rgba(255,255,255,.82)!important;border:1px solid rgba(255,255,255,.92)!important;border-radius:22px!important}
          [data-testid="stCameraInput"] video{display:block!important;width:100%!important;max-width:100%!important;height:auto!important}
          .stTextInput input,[data-baseweb="select"]>div{background:rgba(255,255,255,.95)!important;color:var(--ink)!important;border:1px solid rgba(30,82,48,.16)!important;border-radius:16px!important;min-height:2.85rem!important}
          [data-baseweb="select"] *{color:var(--ink)!important}
          .stButton>button,.stDownloadButton>button{width:auto!important;min-height:2.9rem!important;border-radius:999px!important;padding:.62rem 1.25rem!important;border:1px solid rgba(255,255,255,.9)!important;color:#173d27!important;background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(225,241,229,.86))!important;box-shadow:0 9px 28px rgba(16,76,40,.14),inset 0 1px 0 #fff!important;font-weight:750!important;transition:transform .2s ease,box-shadow .2s ease!important}
          .stButton>button:hover,.stDownloadButton>button:hover{transform:scale(1.03)!important;box-shadow:0 14px 34px rgba(16,76,40,.2)!important}
          .stButton>button:active,.stDownloadButton>button:active{transform:scale(.97)!important}
          .stButton>button[kind="primary"]{color:#fff!important;background:linear-gradient(135deg,#2d8a50,#17643a)!important}
          [data-testid="stMetric"]{background:rgba(255,255,255,.88)!important;border:1px solid rgba(255,255,255,.94)!important;border-radius:20px!important;box-shadow:0 10px 30px rgba(12,55,31,.1)!important}
          [data-testid="stMetricValue"],[data-testid="stMetricLabel"]{color:var(--ink)!important}
          [data-testid="stImage"], [data-testid="stImage"] img{max-width:100%!important;width:100%!important;height:auto!important;object-fit:contain!important;border-radius:20px!important}
          [data-testid="stDataFrame"]{width:100%!important;max-width:100%!important;border-radius:18px!important;overflow:hidden!important}
          [data-testid="stDialog"]>div,[role="dialog"]{width:min(92vw,520px)!important;max-width:calc(100vw - 24px)!important;background:rgba(248,252,249,.99)!important;color:var(--ink)!important;border:1px solid #fff!important;border-radius:24px!important;box-shadow:0 28px 80px rgba(12,50,27,.24)!important;overflow:hidden!important}
          [data-testid="stDialog"] h1,[data-testid="stDialog"] h2,[data-testid="stDialog"] h3,[data-testid="stDialog"] p,[data-testid="stDialog"] label,[role="dialog"] h1,[role="dialog"] h2,[role="dialog"] h3,[role="dialog"] p,[role="dialog"] label{color:var(--ink)!important;text-align:left!important}
          [data-testid="stDialog"] .stButton>button,[role="dialog"] .stButton>button{width:100%!important}
          hr{border:0!important;border-top:1px solid rgba(35,79,47,.14)!important}
          @media(max-width:700px){
            [data-testid="stAppViewContainer"]{background-attachment:scroll!important;background-position:center top!important}
            .main .block-container{width:100%!important;max-width:100%!important;padding:1.1rem .75rem 3rem!important}
            .main .block-container [data-testid="stHorizontalBlock"]{display:block!important}
            .main .block-container [data-testid="column"]{width:100%!important;max-width:100%!important;min-width:0!important;margin:0 0 .65rem!important}
            h1{font-size:clamp(2rem,10vw,2.75rem)!important}
            h2{font-size:1.5rem!important} h3{font-size:1.18rem!important}
            .stButton>button,.stDownloadButton>button{width:100%!important}
            [data-testid="stFileUploaderDropzone"],[data-testid="stCameraInput"]{border-radius:20px!important}
          }
          </style>'''
          text,n=re.subn(r'<style>.*?</style>',css,text,count=1,flags=re.S)
          if n!=1: raise SystemExit('CSS block not found')
          # Hide technical identifiers from the visible history table only; API data remains unchanged.
          pat=r'history = response\.json\(\); st\.dataframe\(history, use_container_width=True\) if history else st\.info\("No scans yet\."\)'
          repl='''history = response.json()
        if history:
            visible_history = [
                {k:v for k,v in row.items() if all(x not in str(k).lower() for x in ("sha", "code", "token"))}
                for row in history if isinstance(row, dict)
            ]
            st.dataframe(visible_history or history, use_container_width=True, hide_index=True)
        else:
            st.info("No scans yet.")'''
          text,n=re.subn(pat,repl,text,count=1)
          if n!=1: raise SystemExit('history block not found')
          # Make camera cleanup run repeatedly while the app is open and on page lifecycle events.
          old=r'components\.html\(\s*"""<script>.*?</script>""",\s*height=0,\s*\)'
          new='''components.html(
              """<script>
              (() => {
                const stop=(root)=>{try{root.querySelectorAll('video').forEach(v=>{const s=v.srcObject;if(s&&s.getTracks)s.getTracks().forEach(t=>t.stop());v.srcObject=null});root.querySelectorAll('iframe').forEach(f=>{try{stop(f.contentWindow.document)}catch(e){}})}catch(e){}};
                const cleanup=()=>{try{stop(window.parent.document)}catch(e){};stop(document)};
                ['visibilitychange','pagehide','beforeunload'].forEach(e=>document.addEventListener(e,cleanup));
                setInterval(cleanup,1000);
              })();
              </script>""",
              height=0,
          )'''
          text,n=re.subn(old,new,text,count=1,flags=re.S)
          if n!=1: raise SystemExit('camera script not found')
          path.write_text(text,encoding='utf-8')
          PY
      - name: Validate
        run: python -m py_compile frontend/app.py
      - name: Commit and remove repair workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/app.py
          git rm .github/workflows/fix-frontend-css.yml .github/workflows/repair-frontend-v3.yml 2>/dev/null || true
          git commit -m 'Fix mobile alignment history display and camera cleanup'
          git push
