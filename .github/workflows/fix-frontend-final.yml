name: CropGuard treatment card repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Repair treatment card placement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair treatment card placement only
        shell: python
        run: |
          from pathlib import Path
          p = Path('frontend/app.py')
          s = p.read_text(encoding='utf-8')
          old = '''                    st.caption(f"Leaf area above activation threshold: {data['heatmap_coverage_percent']:.2f}% • Image SHA-256: {data['image_sha256']}")\n                    st.image(data["heatmap_data_url"], caption="CAM derived from this uploaded image")\n                    if data.get("storage_status") == "unavailable": st.warning("Prediction completed, but scan history could not be saved right now.")\n                    st.subheader(T["predictions"])\n                    st.table([{"class": p["label"], "probability": f"{p['probability'] * 100:.2f}%"} for p in data["top_predictions"]])\n                    advisory = data.get("advisory") or {}\n\n                    # Always show the disease-fix card when an analysis succeeds.\n                    # Display-only change: inference/model/training/API behavior is untouched.\n                    with st.container(border=True):\n                        st.markdown("### 🩺 Disease fix & treatment")\n                        summary = advisory.get("summary") or "Follow the recommended disease-management steps below."\n                        st.markdown(f"**What to do:** {summary}")\n                        actions = advisory.get("actions") or []\n                        if actions:\n                            for action in actions:\n                                st.markdown(f"- {action}")\n                        else:\n                            st.info("No class-specific treatment steps are available for this result.")\n                        for source_link in advisory.get("sources", []):\n                            st.caption(source_link)\n'''
          new = '''                    # Render treatment immediately after a successful API response.\n                    # This display-only block is deliberately before heatmap/table rendering,\n                    # so a visual-only failure in those widgets cannot hide treatment advice.\n                    advisory = data.get("advisory")\n                    if not isinstance(advisory, dict):\n                        advisory = {}\n                    st.markdown("### 🩺 Disease fix & treatment")\n                    summary = advisory.get("summary") or "Follow the recommended disease-management steps below."\n                    st.markdown(f"**What to do:** {summary}")\n                    actions = advisory.get("actions")\n                    if isinstance(actions, list) and actions:\n                        for action in actions:\n                            st.markdown(f"- {action}")\n                    else:\n                        st.info("No class-specific treatment steps are available for this result.")\n                    sources = advisory.get("sources")\n                    if isinstance(sources, list):\n                        for source_link in sources:\n                            st.caption(str(source_link))\n\n                    st.caption(f"Leaf area above activation threshold: {data['heatmap_coverage_percent']:.2f}% • Image SHA-256: {data['image_sha256']}")\n                    st.image(data["heatmap_data_url"], caption="CAM derived from this uploaded image")\n                    if data.get("storage_status") == "unavailable": st.warning("Prediction completed, but scan history could not be saved right now.")\n                    st.subheader(T["predictions"])\n                    st.table([{"class": p["label"], "probability": f"{p['probability'] * 100:.2f}%"} for p in data["top_predictions"]])\n'''
          if old not in s:
              raise SystemExit('Expected analysis display block not found; refusing to modify frontend.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile frontend/app.py
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/app.py
          git commit -m 'Repair treatment card placement'
          git push
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/fix-frontend-final.yml || true
          git commit -m 'Remove temporary treatment card repair workflow' || true
          git push || true
