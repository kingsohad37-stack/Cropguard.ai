name: CropGuard final frontend cleanup

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair frontend styling and remove debug code UI
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('frontend/app.py')
          s=p.read_text(encoding='utf-8')

          # Remove explicit debug/code render calls without touching inference logic.
          s=re.sub(r'^\s*st\.(?:code|json)\([^\n]*\)\s*$', '', s, flags=re.M)

          # Make the visual hierarchy stable: larger readable text, stronger weight,
          # single-column mobile flow, and no horizontal overflow.
          extra=r'''\n<style>\n/* Final stable CropGuard visual pass */\nhtml,body,.stApp,.stMarkdown,p,li,label,[data-testid="stCaptionContainer"]{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif!important;}\n.main .block-container{width:min(100% - 32px,1080px)!important;max-width:1080px!important;margin:0 auto!important;}\n.main .block-container p,.main .block-container li{font-size:1.08rem!important;line-height:1.62!important;font-weight:600!important;color:#294637!important;}\n.main .block-container h1{font-size:clamp(2.7rem,7vw,4.4rem)!important;font-weight:850!important;line-height:1.02!important;}\n.main .block-container h2{font-size:clamp(2rem,5vw,3rem)!important;font-weight:850!important;line-height:1.08!important;}\n.main .block-container h3{font-size:clamp(1.35rem,3.5vw,1.9rem)!important;font-weight:800!important;}\n.main .block-container [data-testid="stVerticalBlockBorderWrapper"]{width:100%!important;box-sizing:border-box!important;padding:clamp(18px,3vw,30px)!important;}\n.main .block-container [data-testid="column"]{min-width:0!important;width:100%!important;flex:1 1 100%!important;}\n.main .block-container [data-testid="stHorizontalBlock"]{flex-wrap:wrap!important;gap:1rem!important;}\n[data-testid="stDataFrame"],[data-testid="stTable"]{width:100%!important;max-width:100%!important;overflow:hidden!important;}\n/* Debug/code-looking output is not part of the user-facing design. */\npre,[data-testid="stCodeBlock"],.stCodeBlock{display:none!important;}\n@media(max-width:700px){\n .main .block-container{width:calc(100% - 20px)!important;padding:1rem 0 3rem!important;}\n .main .block-container p,.main .block-container li{font-size:1.02rem!important;line-height:1.55!important;}\n .main .block-container h1{font-size:2.55rem!important;}\n .main .block-container h2{font-size:1.9rem!important;}\n .main .block-container h3{font-size:1.28rem!important;}\n .main .block-container [data-testid="stVerticalBlockBorderWrapper"]{padding:18px!important;border-radius:22px!important;}\n}\n</style>\n'''
          # Add after the existing style block so these rules win without altering app logic.
          pos=s.rfind('</style>')
          if pos<0: raise SystemExit('CSS block not found')
          s=s[:pos+8]+extra+s[pos+8:]
          p.write_text(s,encoding='utf-8')

      - name: Validate
        run: python -m py_compile frontend/app.py

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/app.py .github/workflows/fix-frontend-final.yml
          git commit -m 'Finalise mobile frontend alignment and remove debug UI'
          git push
