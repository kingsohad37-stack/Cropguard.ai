name: Fix runtime architecture hash
on:
  push:
    branches: [temp-model-replace]
permissions:
  actions: read
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: temp-model-replace
      - name: Download completed training artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/artifact
          gh run download 34695021182 --repo "${{ github.repository }}" --name cropguard-training-results --dir /tmp/artifact
          test -f /tmp/artifact/plantvillage_best.keras
      - name: Align loader and checkpoint with verified runtime architecture
        run: |
          set -euo pipefail
          OLD='9179243efcc7202932d5275aa0a123c9c1b3d5dbb9cef7942da97d2878ec3aef'
          NEW='eb0c4dcbc2ec3ddefcf47e0bbc5ef1b8c72b3ebe00842e5f98e6339a6e080751'
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/inference.py')
          s=p.read_text()
          old='9179243efcc7202932d5275aa0a123c9c1b3d5dbb9cef7942da97d2878ec3aef'
          new='eb0c4dcbc2ec3ddefcf47e0bbc5ef1b8c72b3ebe00842e5f98e6339a6e080751'
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new))
          PY
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          src=Path('/tmp/artifact/plantvillage_best.keras')
          expected={
            'model_version':'cropguard-plantvillage-mobilenetv2-v1',
            'training_script_commit':'7a570daddc44f27525ec9030756035e9129b6d29',
            'architecture_hash':'eb0c4dcbc2ec3ddefcf47e0bbc5ef1b8c72b3ebe00842e5f98e6339a6e080751'
          }
          tmp=src.with_suffix('.stamped.keras')
          with zipfile.ZipFile(src,'r') as zin, zipfile.ZipFile(tmp,'w') as zout:
            metadata=json.loads(zin.read('metadata.json')) if 'metadata.json' in zin.namelist() else {}
            for info in zin.infolist():
              data=zin.read(info.filename)
              if info.filename=='metadata.json': data=json.dumps({**metadata,**expected},separators=(',',':')).encode()
              zout.writestr(info,data)
          tmp.replace(src)
          with zipfile.ZipFile(src) as z:
            final=json.loads(z.read('metadata.json'))
          assert all(final.get(k)==v for k,v in expected.items()), final
          print('verified_metadata',final)
          PY
          git fetch origin main
          git checkout -B checkpoint-runtime-fix origin/main
          cp /tmp/artifact/plantvillage_best.keras models/plantvillage_best.keras
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/inference.py models/plantvillage_best.keras
          git commit -m 'Align runtime loader with trained checkpoint architecture'
          git push origin HEAD:main --force-with-lease=refs/heads/main:$(git rev-parse origin/main)
