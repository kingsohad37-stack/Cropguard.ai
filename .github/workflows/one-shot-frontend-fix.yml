name: One-shot dashboard compatibility fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch dashboard
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("frontend/app.py")
          s = p.read_text(encoding="utf-8")

          if "import base64\n" not in s:
              s = s.replace("import os\n", "import os\nimport base64\n", 1)

          pattern = r'(?m)^(\s*)st\.image\(data\["heatmap_data_url"\], caption="CAM derived from this uploaded image"\)\s*$'
          replacement = r'''\1heatmap = data.get("heatmap_data_url")
\1if not heatmap and data.get("heatmap_png_base64"):
\1    heatmap = base64.b64decode(data["heatmap_png_base64"])
\1if heatmap:
\1    st.image(heatmap, caption="CAM derived from this uploaded image")
\1else:
\1    st.info("Grad-CAM visualization is unavailable for this result.")'''

          patched, count = re.subn(pattern, replacement, s, count=1)
          if count == 0 and "heatmap_png_base64" not in s:
              raise SystemExit("Obsolete heatmap renderer was not found; refusing to change unrelated code")

          p.write_text(patched, encoding="utf-8")

      - name: Validate
        run: python -m py_compile frontend/app.py

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@github.com'
          git add frontend/app.py
          git rm .github/workflows/one-shot-frontend-fix.yml
          git commit -m 'Fix dashboard heatmap response compatibility'
          git push