name: Patch visible disease advisory card

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch advisory display
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/app.py')
          s = p.read_text(encoding='utf-8')
          old = '''advisory = data["advisory"]\nst.subheader(T["advisory"])\nst.write(advisory["summary"])\nfor action in advisory["actions"]:\n    st.write(f"• {action}")\nfor source_link in advisory.get("sources", []):\n    st.caption(source_link)'''
          new = '''advisory = data.get("advisory") or {}\n\n# Always show the disease-fix card when an analysis succeeds.\n# Display-only change: inference/model/training/API behavior is untouched.\nwith st.container(border=True):\n    st.markdown("### 🩺 Disease fix & treatment")\n    summary = advisory.get("summary") or "Follow the recommended disease-management steps below."\n    st.markdown(f"**What to do:** {summary}")\n    actions = advisory.get("actions") or []\n    if actions:\n        for action in actions:\n            st.markdown(f"- {action}")\n    else:\n        st.info("No class-specific treatment steps are available for this result.")\n    for source_link in advisory.get("sources", []):\n        st.caption(source_link)'''
          if old in s:
              s = s.replace(old, new, 1)
          elif '### 🩺 Disease fix & treatment' not in s:
              marker = 'advisory = data["advisory"]'
              i = s.find(marker)
              if i < 0:
                  raise SystemExit('advisory display block not found')
              end = s.find('\n\n', i)
              if end < 0: end = len(s)
              s = s[:i] + new + s[end:]
          else:
              raise SystemExit('unexpected advisory block format')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app.py
          git diff --cached --quiet && exit 0
          git commit -m "Show disease fix card on analysis results"
          git push