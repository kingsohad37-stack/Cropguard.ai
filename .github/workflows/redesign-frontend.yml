name: CropGuard complete frontend redesign

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/redesign-frontend.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace visual layer only
        env:
          BG_B64: 
          PY
        python - <<'PY'
import os, re
from pathlib import Path
p=Path('frontend/app.py')
s=p.read_text(encoding='utf-8')
start=s.index('# Premium visual layer only')
end=s.index('# Explicitly stop browser camera tracks', start)
bg=os.environ['BG_B64']
css=f'''# Premium visual layer only: visual/styling changes; inference, routes and data remain untouched.
st.markdown(r"""
<style>
:root{{--ink:#173323;--muted:#5d6f63;--green:#2e7448;--glass:rgba(255,255,255,.58);--line:rgba(255,255,255,.68);--shadow:0 20px 60px rgba(20,58,36,.14)}}
html,body,[class*="css"]{{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif!important}}
[data-testid="stAppViewContainer"]{{position:relative;min-height:100vh;background:linear-gradient(180deg,rgba(246,250,247,.78),rgba(231,241,234,.88)),url("data:image/jpeg;base64,{bg}") center/cover fixed no-repeat!important}}
[data-testid="stAppViewContainer"]:before{{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 15% 5%,rgba(255,255,255,.72),transparent 34%),linear-gradient(120deg,rgba(255,255,255,.28),rgba(220,239,225,.34));}}
[data-testid="stHeader"]{{background:transparent!important}}
.main .block-container{{position:relative;z-index:1;width:min(100%,1120px);max-width:1120px;padding:3rem 1.25rem 4rem!important}}
h1,h2,h3{{color:var(--ink)!important;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif!important;font-weight:800!important;letter-spacing:-.045em!important}}
h1{{font-size:clamp(2.7rem,6vw,5rem)!important;line-height:.98!important;margin:.15rem 0 .35rem!important}}h2{{font-size:clamp(1.7rem,3vw,2.25rem)!important}}h3{{font-size:1.25rem!important}}
p,label,[data-testid="stCaptionContainer"]{{color:var(--muted)!important}}
.cg-glass{{padding:1.35rem 1.5rem;border:1px solid var(--line);border-radius:26px;background:rgba(255,255,255,.34);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:var(--shadow)}}
[data-testid="stSidebar"]>div:first-child{{background:rgba(246,250,247,.68)!important;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-right:1px solid var(--line)!important}}
[data-testid="stFileUploaderDropzone"],[data-testid="stCameraInput"]{{background:rgba(255,255,255,.5)!important;border:1px solid var(--line)!important;border-radius:22px!important;box-shadow:0 14px 40px rgba(20,58,36,.1)!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}}
[data-testid="stFileUploaderDropzone"]{{padding:1.2rem!important}}
.stTextInput input,.stSelectbox [data-baseweb="select"]>div{{background:rgba(255,255,255,.64)!important;border:1px solid var(--line)!important;border-radius:16px!important;min-height:2.85rem}}
.stButton>button,.stDownloadButton>button{{min-height:2.9rem;border-radius:999px!important;border:1px solid var(--line)!important;padding:.62rem 1.2rem!important;font-weight:750!important;color:#214d32!important;background:linear-gradient(135deg,rgba(255,255,255,.82),rgba(255,255,255,.46))!important;box-shadow:0 10px 30px rgba(25,67,41,.12),inset 0 1px 0 rgba(255,255,255,.96)!important;transition:all .2s ease!important}}
.stButton>button:hover,.stDownloadButton>button:hover{{transform:scale(1.04);box-shadow:0 15px 38px rgba(25,67,41,.18),inset 0 1px 0 #fff!important}}
.stButton>button:active,.stDownloadButton>button:active{{transform:scale(.97)}}
.stButton>button[kind="primary"]{{color:#fff!important;background:linear-gradient(135deg,#3d8a59,#1f6039)!important;box-shadow:0 14px 38px rgba(30,100,54,.28),inset 0 1px 0 rgba(255,255,255,.28)!important}}
[data-testid="stMetric"]{{background:rgba(255,255,255,.5)!important;border:1px solid var(--line)!important;border-radius:20px!important;padding:1rem!important;box-shadow:0 12px 36px rgba(25,65,42,.1)!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:cgIn .5s cubic-bezier(.4,0,.2,1) both}}
[data-testid="stMetricValue"],[data-testid="stMetricLabel"]{{color:var(--ink)!important}}
[data-testid="stImage"] img{{max-width:100%!important;height:auto!important;border-radius:22px!important;border:1px solid var(--line)!important;box-shadow:0 18px 55px rgba(24,61,39,.16)!important}}
[data-testid="stAlert"],[data-testid="stDataFrame"]{{border-radius:18px!important;border:1px solid var(--line)!important;box-shadow:0 10px 32px rgba(24,62,39,.08)!important}}
[data-testid="stDialog"]>div{{width:min(92vw,520px)!important;border-radius:28px!important;background:rgba(247,251,248,.76)!important;border:1px solid rgba(255,255,255,.82)!important;backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:0 30px 90px rgba(20,55,34,.26)!important}}
hr{{border:0!important;border-top:1px solid rgba(40,80,53,.14)!important;margin:2.3rem 0!important}}
@keyframes cgIn{{from{{opacity:0;transform:translateY(10px)}}to{{opacity:1;transform:none}}}}
@media(max-width:700px){{.main .block-container{{padding:1.35rem .75rem 2.8rem!important}}h1{{font-size:2.65rem!important}}h2{{font-size:1.6rem!important}}.cg-glass{{padding:1rem;border-radius:22px}}}}
</style>
""",unsafe_allow_html=True)

'''
p.write_text(s[:start]+css+s[end:],encoding='utf-8')
PY
        git diff --check
        python -m py_compile frontend/app.py
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app.py .github/workflows/redesign-frontend.yml
          git commit -m "Completely redesign CropGuard frontend with real background"
          git push
          git rm .github/workflows/redesign-frontend.yml
          git commit -m "Remove one-time frontend redesign workflow"
          git push
