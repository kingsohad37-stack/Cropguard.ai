name: CropGuard frontend background fix

on:
  push:
    paths:
      - '.github/workflows/redesign-frontend.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply background image and safer glass styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/app.py')
          s = p.read_text(encoding='utf-8')
          old = '''    body { background: #edf3ee !important; }\n\n    [data-testid="stAppViewContainer"] {\n        background:\n            radial-gradient(circle at 8% 0%, rgba(255,255,255,.95), transparent 34%),\n            radial-gradient(circle at 92% 82%, rgba(196,228,202,.42), transparent 32%),\n            linear-gradient(145deg, #f5f9f5 0%, #eaf2ec 100%) !important;\n    }'''
          new = '''    body {\n        background: #eaf3ec url('/app/static/cropguard-bg.jpg') center / cover fixed no-repeat !important;\n    }\n\n    [data-testid="stAppViewContainer"] {\n        background:\n            linear-gradient(135deg, rgba(245,250,246,.74), rgba(226,240,230,.82)),\n            url('/app/static/cropguard-bg.jpg') center / cover fixed no-repeat !important;\n        min-height: 100vh;\n    }\n\n    [data-testid="stAppViewContainer"]::before {\n        content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;\n        background: radial-gradient(circle at 15% 5%, rgba(255,255,255,.68), transparent 36%);\n    }\n\n    .main .block-container { position: relative; z-index: 1; }'''
          if old not in s:
              raise SystemExit('Expected visual block not found')
          s = s.replace(old, new, 1)
          s = s.replace('background: var(--cg-surface) !important;', 'background: rgba(255,255,255,.42) !important; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);', 1)
          s = s.replace('transition: box-shadow .2s ease, background .2s ease !important;', 'transition: all .2s ease !important;')
          s = s.replace('background: rgba(245,249,245,.94) !important;', 'background: rgba(246,250,247,.68) !important; backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);')
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile frontend/app.py
          git diff --check
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/app.py
          git commit -m 'Fix CropGuard glass frontend background'
          git push
          git rm .github/workflows/redesign-frontend.yml
          git commit -m 'Remove one-time frontend background workflow'
          git push
