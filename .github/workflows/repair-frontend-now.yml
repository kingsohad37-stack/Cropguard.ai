name: Repair frontend now
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair and compile
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/app.py')
          lines = p.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == '# Always show the disease-fix card when an analysis succeeds.')
          divider = next(i for i in range(start, len(lines)) if lines[i].strip() == 'st.divider()')
          # Put the advisory card back inside the existing analysis try block.
          for i in range(start, divider):
              if lines[i].strip():
                  lines[i] = '            ' + lines[i].lstrip()
              else:
                  lines[i] = ''
          # Restore the missing outer except before the model-evidence divider.
          if not any(line.strip().startswith('except requests.RequestException as exc:') for line in lines[start:divider+1]):
              lines.insert(divider, '            except requests.RequestException as exc:')
              lines.insert(divider + 1, '                st.error(f"Analysis request failed: {exc}")')
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python -m py_compile frontend/app.py
      - name: Commit repaired frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app.py
          git commit -m "Repair frontend advisory card syntax" || exit 0
          git push
