name: CropGuard frontend repair v2

on:
  push:
    paths:
      - '.github/workflows/repair-frontend-v2.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply repair
        run: python scripts/repair_frontend_design.py
      - name: Verify
        run: python -m py_compile frontend/app.py
      - name: Commit frontend fix and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app.py
          git commit -m "Fix responsive frontend layout" || true
          git rm .github/workflows/repair-frontend-v2.yml scripts/repair_frontend_design.py
          git commit -m "Remove temporary frontend repair files" || true
          git push
