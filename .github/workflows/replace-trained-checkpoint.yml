name: Replace trained CropGuard checkpoint
on:
  push:
    branches: [temp-model-replace]
permissions:
  actions: read
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: temp-model-replace
      - name: Download training artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/artifact
          gh run download 34695021182 --repo "${{ github.repository }}" --name cropguard-training-results --dir /tmp/artifact
          test -f /tmp/artifact/plantvillage_best.keras
      - name: Verify and replace checkpoint on current main
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, zipfile, hashlib
          from pathlib import Path
          p=Path('/tmp/artifact/plantvillage_best.keras')
          size=p.stat().st_size
          assert size > 24000000, size
          with zipfile.ZipFile(p) as z:
              cfg=json.loads(z.read('config.json'))
          names=[(x.get('name'),x.get('class_name')) for x in cfg['config']['layers']]
          required=[('global_average_pooling2d','GlobalAveragePooling2D'),('batch_normalization','BatchNormalization'),('dropout','Dropout'),('predictions','Dense')]
          for item in required:
              assert item in names, item
          print('verified_size', size)
          print('sha256', hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          git fetch origin main
          git checkout -B checkpoint-replace origin/main
          cp /tmp/artifact/plantvillage_best.keras models/plantvillage_best.keras
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/plantvillage_best.keras
          git commit -m 'Replace stale checkpoint with verified 10+6 trained artifact'
          git push origin HEAD:main --force-with-lease=refs/heads/main:$(git rev-parse origin/main)
