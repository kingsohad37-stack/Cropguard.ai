name: Train CropGuard model

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/train.py'
      - 'scripts/prepare_plantvillage.py'
      - '.github/workflows/train-model.yml'

permissions:
  contents: write

concurrency:
  group: cropguard-model-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow==2.18.0 numpy==2.0.2 pandas==2.2.3 pillow==11.1.0 scikit-learn==1.6.1

      - name: Verify preparation script
        run: python scripts/prepare_plantvillage.py --help

      - name: Download the real PlantVillage dataset
        run: |
          set -euo pipefail
          mkdir -p /tmp/plantvillage
          curl -L --fail --retry 8 --retry-all-errors --retry-delay 5 -o /tmp/plantvillage/data.zip https://huggingface.co/datasets/mohanty/PlantVillage/resolve/main/data.zip
          curl -L --fail --retry 8 --retry-all-errors --retry-delay 5 -o /tmp/plantvillage/train.txt https://huggingface.co/datasets/mohanty/PlantVillage/resolve/main/splits/color_train.txt
          curl -L --fail --retry 8 --retry-all-errors --retry-delay 5 -o /tmp/plantvillage/test.txt https://huggingface.co/datasets/mohanty/PlantVillage/resolve/main/splits/color_test.txt
          unzip -q /tmp/plantvillage/data.zip -d /tmp/plantvillage/images
          test -s /tmp/plantvillage/train.txt
          test -s /tmp/plantvillage/test.txt
          test -d /tmp/plantvillage/images

      - name: Build leakage-safe CSV splits
        run: python scripts/prepare_plantvillage.py --root /tmp/plantvillage/images --train-list /tmp/plantvillage/train.txt --test-list /tmp/plantvillage/test.txt

      - name: Verify generated splits
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          for name in ('train', 'val', 'test'):
              p = Path(f'data/splits/{name}.csv')
              if not p.exists() or p.stat().st_size == 0:
                  raise SystemExit(f'Missing or empty split: {p}')
              df = pd.read_csv(p)
              if df.empty or not {'path','label'}.issubset(df.columns):
                  raise SystemExit(f'Invalid split: {p}')
              print(f'{name}: {len(df)} samples, {df.label.nunique()} classes')
          PY

      - name: Train advanced model
        env:
          TF_CPP_MIN_LOG_LEVEL: '1'
          TF_NUM_INTRAOP_THREADS: '2'
          TF_NUM_INTEROP_THREADS: '2'
        run: |
          set -euo pipefail
          # Keep every class represented while bounding CPU training time on GitHub runners.
          # This is still real PlantVillage data; no predictions or metrics are mocked.
          python scripts/train.py --epochs 12 --fine-tune-epochs 8 --batch-size 16 --max-per-class 500

      - name: Verify trained artifacts before evaluation
        run: |
          set -euo pipefail
          test -s models/plantvillage_best.keras
          test -s models/training_log.csv
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('models/metrics.json')
          if not p.exists(): raise SystemExit('metrics.json missing')
          m=json.loads(p.read_text())
          if m.get('classes') != 38: raise SystemExit(f"Unexpected class count: {m.get('classes')}")
          if not 0 < float(m.get('test_accuracy', 0)) <= 1: raise SystemExit('Invalid test accuracy')
          print('Training artifact verified:', m)
          PY

      - name: Evaluate model
        run: python scripts/evaluate.py

      - name: Show real metrics
        run: |
          cat models/metrics.json
          cat models/evaluation.json

      - name: Upload training results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cropguard-training-results
          path: |
            models/plantvillage_best.keras
            models/metrics.json
            models/training_log.csv
            models/evaluation.json
            models/per_class_metrics.csv
            models/confusion_matrix.npy
            models/confusion_matrix.png
          if-no-files-found: error
          retention-days: 14

      - name: Commit trained model and metrics safely
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          mkdir -p /tmp/cropguard-trained
          cp models/plantvillage_best.keras /tmp/cropguard-trained/
          cp models/metrics.json models/training_log.csv models/evaluation.json /tmp/cropguard-trained/
          cp models/per_class_metrics.csv models/confusion_matrix.npy models/confusion_matrix.png /tmp/cropguard-trained/
          cp -r data/splits /tmp/cropguard-trained/splits

          for attempt in 1 2 3 4 5; do
            echo "Publishing trained artifacts, attempt $attempt/5"
            git fetch origin main
            git reset --hard origin/main

            cp /tmp/cropguard-trained/plantvillage_best.keras models/plantvillage_best.keras
            cp /tmp/cropguard-trained/metrics.json /tmp/cropguard-trained/training_log.csv /tmp/cropguard-trained/evaluation.json models/
            cp /tmp/cropguard-trained/per_class_metrics.csv /tmp/cropguard-trained/confusion_matrix.npy /tmp/cropguard-trained/confusion_matrix.png models/
            rm -rf data/splits
            cp -r /tmp/cropguard-trained/splits data/splits

            git add models/plantvillage_best.keras models/metrics.json models/training_log.csv models/evaluation.json models/per_class_metrics.csv models/confusion_matrix.npy models/confusion_matrix.png data/splits
            git diff --cached --quiet && { echo 'No artifact changes to commit.'; exit 0; }
            git commit -m 'Train and evaluate advanced CropGuard model'

            if git push origin HEAD:main; then
              echo 'Trained model and metrics published successfully.'
              exit 0
            fi
            git reset --hard HEAD~1
            sleep 5
          done

          echo 'Failed to publish trained artifacts after 5 attempts.'
          exit 1
