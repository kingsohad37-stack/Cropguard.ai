name: Train CropGuard model

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/train.py'
      - 'scripts/prepare_plantvillage.py'
      - '.github/workflows/train-model.yml'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow==2.18.0 numpy==2.0.2 pandas==2.2.3 pillow==11.1.0 scikit-learn==1.6.1

      - name: Verify preparation script
        run: python scripts/prepare_plantvillage.py --help

      - name: Download the real PlantVillage dataset
        run: |
          mkdir -p /tmp/plantvillage
          curl -L --fail --retry 3 -o /tmp/plantvillage/data.zip https://huggingface.co/datasets/mohanty/PlantVillage/resolve/main/data.zip
          curl -L --fail --retry 3 -o /tmp/plantvillage/train.txt https://huggingface.co/datasets/mohanty/PlantVillage/resolve/main/splits/color_train.txt
          curl -L --fail --retry 3 -o /tmp/plantvillage/test.txt https://huggingface.co/datasets/mohanty/PlantVillage/resolve/main/splits/color_test.txt
          unzip -q /tmp/plantvillage/data.zip -d /tmp/plantvillage/images

      - name: Build leakage-safe CSV splits
        run: python scripts/prepare_plantvillage.py --root /tmp/plantvillage/images --train-list /tmp/plantvillage/train.txt --test-list /tmp/plantvillage/test.txt

      - name: Train advanced model
        run: python scripts/train.py --epochs 12 --fine-tune-epochs 8 --batch-size 32

      - name: Evaluate model
        run: python scripts/evaluate.py

      - name: Show real metrics
        run: |
          cat models/metrics.json
          cat models/evaluation.json

      - name: Upload training results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cropguard-training-results
          path: |
            models/metrics.json
            models/training_log.csv
            models/evaluation.json
            models/per_class_metrics.csv
            models/confusion_matrix.npy
            models/confusion_matrix.png
          if-no-files-found: warn

      - name: Commit trained model and metrics
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/plantvillage_best.keras models/metrics.json models/training_log.csv models/evaluation.json models/per_class_metrics.csv models/confusion_matrix.npy models/confusion_matrix.png data/splits
          git diff --cached --quiet || git commit -m 'Train and evaluate advanced CropGuard model'
          git push
